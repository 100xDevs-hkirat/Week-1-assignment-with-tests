name: Solution tests
on:
  push:
  pull_request:
jobs:
  solutions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: solutions/package-lock.json
      - run: npm ci
        working-directory: solutions
      - run: npm test
        working-directory: solutions
